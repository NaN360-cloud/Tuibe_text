<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>城市夜景烟花</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    cursor:crosshair;
}

/* 城市夜景背景 */
.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.6) 1px, transparent 1px),
        radial-gradient(circle at 50% 90%, rgba(255,255,255,0.7) 1px, transparent 1px),
        linear-gradient(to bottom, #080b2a 0%, #101435 45%, #1a1f4a 100%);
    background-size:
        200px 200px,
        150px 150px,
        180px 180px,
        100% 100%;
}

/* 城市楼群剪影 */
.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:35%;
    background:#05071e;
}

.city::before{
    content:'';
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
    background:
        linear-gradient(to right,
            transparent 0%, transparent 8%,
            #05071e 8%, #05071e 12%,
            transparent 12%, transparent 18%,
            #05071e 18%, #05071e 24%,
            transparent 24%, transparent 30%,
            #05071e 30%, #05071e 36%,
            transparent 36%, transparent 42%,
            #05071e 42%, #05071e 55%,
            transparent 55%, transparent 60%,
            #05071e 60%, #05071e 68%,
            transparent 68%, transparent 74%,
            #05071e 74%, #05071e 82%,
            transparent 82%, transparent 88%,
            #05071e 88%, #05071e 94%,
            transparent 94%
        ),
        linear-gradient(to top, #05071e 0%, #05071e 60%, transparent 60%);
    background-size:100% 100%;
}

/* 窗户灯光 */
.windows{
    position:absolute;
    bottom:0;
    width:100%;
    height:30%;
    opacity:0.35;
    background-image:
        radial-gradient(circle at 12% 85%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 16% 78%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 22% 88%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 31% 82%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 38% 75%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 46% 86%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 52% 72%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 61% 80%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 66% 87%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 73% 76%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 79% 84%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 86% 79%, #ffdd44 2px, transparent 2px),
        radial-gradient(circle at 91% 88%, #ffdd44 2px, transparent 2px);
    background-size:100% 100%;
}

/* 烟花画布 */
canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}
</style>
</head>

<body>
    <div class="bg"></div>
    <div class="city"></div>
    <div class="windows"></div>
    <canvas id="fireworks"></canvas>

    <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    const particles = [];

    const colors = [
        "#ff4d4d", "#ffdd44", "#4dff88", "#4da6ff", "#ff4dc4",
        "#ff9900", "#00ffff", "#ff66b2", "#ffffff"
    ];

    class Particle {
        constructor(x, y, color){
            this.x = x;
            this.y = y;
            this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 5 + 2;
            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;
            this.alpha = 1;
            this.life = Math.random() * 80 + 40;
            this.size = Math.random() * 3 + 1;
        }

        update(){
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05;
            this.vx *= 0.98;
            this.vy *= 0.98;
            this.alpha -= 0.008;
            this.life--;
        }

        draw(){
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        dead(){
            return this.alpha <= 0 || this.life <= 0;
        }
    }

    function createFirework(x, y){
        const color = colors[Math.floor(Math.random() * colors.length)];
        const count = Math.floor(Math.random() * 60) + 80;

        for(let i = 0; i < count; i++){
            particles.push(new Particle(x, y, color));
        }
    }

    function autoFirework(){
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.45;
        createFirework(x, y);
    }

    setInterval(autoFirework, 1200);

    canvas.addEventListener("click", e => {
        createFirework(e.clientX, e.clientY);
    });

    function loop(){
        ctx.fillStyle = "rgba(10, 15, 40, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let i = particles.length - 1; i >= 0; i--){
            const p = particles[i];
            p.update();
            p.draw();

            if(p.dead()){
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(loop);
    }

    loop();
    </script>
</body>
</html>
